name: TEK2 Soft Shadows Windows

on:
  workflow_dispatch:
  push:
    branches:
      - agent/tek2-soft-shadows-2026-06-12
    paths:
      - "tek2-soft-shadows/**"
      - ".github/workflows/tek2-soft-shadows-windows.yml"
  pull_request:
    paths:
      - "tek2-soft-shadows/**"
      - ".github/workflows/tek2-soft-shadows-windows.yml"

permissions:
  contents: read
  packages: read

jobs:
  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Confirm Recoil base version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          BASE_COMMIT="$(git rev-parse '2026.06.12^{commit}')"
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD
          echo "Verified Recoil 2026.06.12 base commit: ${BASE_COMMIT:0:12}"

      - name: Apply TEK2 soft-shadow patch
        run: python3 tek2-soft-shadows/apply_patch.py

      - name: Apply PCSS V3 resolution tuning
        run: python3 tek2-soft-shadows/apply_pcss_tuning.py

      - name: Make PCSS sampler code headless-safe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("rts/Rendering/ShadowHandler.cpp")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new):
              global text
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"Expected exactly one headless anchor, found {n}")
              text = text.replace(old, new, 1)

          replace_once(
              "\tif (shadowDepthRawSampler != 0) {\n\t\tglDeleteSamplers(1, &shadowDepthRawSampler);\n\t\tshadowDepthRawSampler = 0;\n\t}\n",
              "#ifndef HEADLESS\n\tif (shadowDepthRawSampler != 0) {\n\t\tglDeleteSamplers(1, &shadowDepthRawSampler);\n\t\tshadowDepthRawSampler = 0;\n\t}\n#else\n\tshadowDepthRawSampler = 0;\n#endif\n"
          )

          replace_once(
              "\tif (status && globalRendering->haveGL4) {\n\t\tif (shadowDepthRawSampler != 0)\n\t\t\tglDeleteSamplers(1, &shadowDepthRawSampler);\n\n\t\tglGenSamplers(1, &shadowDepthRawSampler);\n\t\tglSamplerParameterfv(shadowDepthRawSampler, GL_TEXTURE_BORDER_COLOR, one);\n\t\tglSamplerParameteri(shadowDepthRawSampler, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_BORDER);\n\t\tglSamplerParameteri(shadowDepthRawSampler, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_BORDER);\n\t\tglSamplerParameteri(shadowDepthRawSampler, GL_TEXTURE_MIN_FILTER, GL_NEAREST);\n\t\tglSamplerParameteri(shadowDepthRawSampler, GL_TEXTURE_MAG_FILTER, GL_NEAREST);\n\t\tglSamplerParameteri(shadowDepthRawSampler, GL_TEXTURE_COMPARE_MODE, GL_NONE);\n\t}\n",
              "#ifndef HEADLESS\n\tif (status && globalRendering->haveGL4) {\n\t\tif (shadowDepthRawSampler != 0)\n\t\t\tglDeleteSamplers(1, &shadowDepthRawSampler);\n\n\t\tglGenSamplers(1, &shadowDepthRawSampler);\n\t\tglSamplerParameterfv(shadowDepthRawSampler, GL_TEXTURE_BORDER_COLOR, one);\n\t\tglSamplerParameteri(shadowDepthRawSampler, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_BORDER);\n\t\tglSamplerParameteri(shadowDepthRawSampler, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_BORDER);\n\t\tglSamplerParameteri(shadowDepthRawSampler, GL_TEXTURE_MIN_FILTER, GL_NEAREST);\n\t\tglSamplerParameteri(shadowDepthRawSampler, GL_TEXTURE_MAG_FILTER, GL_NEAREST);\n\t\tglSamplerParameteri(shadowDepthRawSampler, GL_TEXTURE_COMPARE_MODE, GL_NONE);\n\t}\n#endif\n"
          )

          replace_once(
              "void CShadowHandler::SetupShadowDepthRawSampler(unsigned int texUnit, bool enable) const\n{\n\tif (shadowDepthRawSampler == 0)\n\t\treturn;\n\n\tglActiveTexture(texUnit);\n\tglBindTexture(GL_TEXTURE_2D, shadowDepthTexture);\n\tglBindSampler(texUnit - GL_TEXTURE0, shadowDepthRawSampler);\n\n\tif (enable)\n\t\tglEnable(GL_TEXTURE_2D);\n}\n",
              "void CShadowHandler::SetupShadowDepthRawSampler(unsigned int texUnit, bool enable) const\n{\n#ifndef HEADLESS\n\tif (shadowDepthRawSampler == 0)\n\t\treturn;\n\n\tglActiveTexture(texUnit);\n\tglBindTexture(GL_TEXTURE_2D, shadowDepthTexture);\n\tglBindSampler(texUnit - GL_TEXTURE0, shadowDepthRawSampler);\n\n\tif (enable)\n\t\tglEnable(GL_TEXTURE_2D);\n#else\n\t(void)texUnit;\n\t(void)enable;\n#endif\n}\n"
          )

          replace_once(
              "void CShadowHandler::ResetShadowDepthRawSampler(unsigned int texUnit, bool disable) const\n{\n\tif (shadowDepthRawSampler == 0)\n\t\treturn;\n\n\tglActiveTexture(texUnit);\n\tglBindSampler(texUnit - GL_TEXTURE0, 0);\n\tglBindTexture(GL_TEXTURE_2D, 0);\n\n\tif (disable)\n\t\tglDisable(GL_TEXTURE_2D);\n}\n",
              "void CShadowHandler::ResetShadowDepthRawSampler(unsigned int texUnit, bool disable) const\n{\n#ifndef HEADLESS\n\tif (shadowDepthRawSampler == 0)\n\t\treturn;\n\n\tglActiveTexture(texUnit);\n\tglBindSampler(texUnit - GL_TEXTURE0, 0);\n\tglBindTexture(GL_TEXTURE_2D, 0);\n\n\tif (disable)\n\t\tglDisable(GL_TEXTURE_2D);\n#else\n\t(void)texUnit;\n\t(void)disable;\n#endif\n}\n"
          )

          path.write_text(text, encoding="utf-8", newline="\n")
          print("Guarded PCSS sampler-object calls from HEADLESS")
          PY

      - name: Prepare non-interactive Docker build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docker-build-v2/build.sh")
          text = path.read_text(encoding="utf-8")
          old = "$RUNTIME run --platform=linux/$ARCH -it --rm \\\n"
          new = "$RUNTIME run --platform=linux/$ARCH --rm \\\n"
          if old not in text:
              raise SystemExit("Could not locate Docker TTY flags in build.sh")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          print("Disabled Docker interactive TTY flags for GitHub Actions")
          PY

      - name: Build Windows amd64 engine
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          chmod +x docker-build-v2/build.sh
          ./docker-build-v2/build.sh --arch amd64 --jobs 4 windows

      - name: Package ready-to-use engine
        shell: bash
        run: |
          set -euo pipefail
          test -d build-amd64-windows/install
          cd build-amd64-windows/install
          zip -r9 "${GITHUB_WORKSPACE}/RecoilEngine-2026.06.12-TEK2-SoftShadows-Windows.zip" .

      - name: Upload Windows engine ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RecoilEngine-2026.06.12-TEK2-SoftShadows-Windows
          path: RecoilEngine-2026.06.12-TEK2-SoftShadows-Windows.zip
          if-no-files-found: error
          retention-days: 14
